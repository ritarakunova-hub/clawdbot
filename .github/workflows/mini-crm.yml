name: Mini CRM Checks

on:
  pull_request:
    paths:
      - "mini-crm/**"
      - ".github/workflows/mini-crm.yml"
  push:
    branches:
      - "feat/mini-crm-secure-intake"
    paths:
      - "mini-crm/**"
      - ".github/workflows/mini-crm.yml"

permissions:
  contents: read

jobs:
  sync-lockfile:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/mini-crm-secure-intake' && github.actor == 'ritarakunova-hub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mini-crm
    steps:
      - name: Checkout target branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mini-crm/package-lock.json
      - name: Resolve and audit committed dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile changes when required
        working-directory: .
        run: |
          if git diff --quiet -- mini-crm/package-lock.json; then
            echo "Lockfile already matches package.json and passes audit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mini-crm/package-lock.json
            git commit -m "chore(mini-crm): sync audited dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  test:
    needs: sync-lockfile
    if: ${{ always() && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    defaults:
      run:
        working-directory: mini-crm
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mini-crm/package-lock.json
      - name: Install exact committed dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        run: npm test
