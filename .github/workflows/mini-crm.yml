name: Mini CRM Checks

on:
  pull_request:
    paths:
      - "mini-crm/**"
      - ".github/workflows/mini-crm.yml"
  push:
    branches:
      - "feat/mini-crm-secure-intake"
    paths:
      - "mini-crm/**"
      - ".github/workflows/mini-crm.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    defaults:
      run:
        working-directory: mini-crm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mini-crm/package-lock.json
      - name: Resolve patched lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only
      - name: Install dependencies from resolved lockfile
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Summarize dependency advisories
        run: |
          npm audit --json > /tmp/mini-crm-audit.json || true
          node -e "const report=require('/tmp/mini-crm-audit.json'); for (const [name,item] of Object.entries(report.vulnerabilities||{})) { const via=(item.via||[]).map(v=>typeof v==='string'?v:{title:v.title,url:v.url,range:v.range}); console.log(JSON.stringify({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via})); }"
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mini-crm-lockfile-node-${{ matrix.node-version }}
          path: mini-crm/package-lock.json
          retention-days: 1
