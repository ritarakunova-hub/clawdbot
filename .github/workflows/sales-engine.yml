name: Sales Engine Security Checks

on:
  pull_request:
    paths:
      - "sales-engine/**"
      - ".github/workflows/sales-engine.yml"
  push:
    branches:
      - "security/sales-engine-2026-11-15"
      - "fix/sales-engine-telegram-delivery-v1"
    paths:
      - "sales-engine/**"
      - ".github/workflows/sales-engine.yml"

permissions:
  contents: read

jobs:
  sync-lockfile:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/security/sales-engine-2026-11-15' || github.ref == 'refs/heads/fix/sales-engine-telegram-delivery-v1') && github.actor == 'ritarakunova-hub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: sales-engine
    steps:
      - name: Checkout target branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sales-engine/package-lock.json
      - name: Resolve and audit committed dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile changes when required
        working-directory: .
        run: |
          if git diff --quiet -- sales-engine/package-lock.json; then
            echo "Lockfile already matches package.json and passes audit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sales-engine/package-lock.json
            git commit -m "chore(sales-engine): sync audited dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  test:
    needs: sync-lockfile
    if: ${{ always() && (needs.sync-lockfile.result == 'success' || needs.sync-lockfile.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    defaults:
      run:
        working-directory: sales-engine
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sales-engine/package-lock.json
      - name: Install exact committed dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check deployment environment without values
        run: node scripts/preflight.js
        continue-on-error: true
        env:
          NODE_ENV: production
          PORT: "3000"
          ANTHROPIC_API_KEY: test-key
          GOOGLE_SHEET_ID: test-sheet
          GOOGLE_SERVICE_ACCOUNT_KEY_BASE64: e30=
          TELEGRAM_BOT_TOKEN: "123:test-token"
          TELEGRAM_CHAT_ID: "12345"
          TELEGRAM_WEBHOOK_SECRET: "x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x"
          TELEGRAM_ADMIN_USER_ID: "12345"
          APP_USERNAME: test-user
          APP_PASSWORD: "a-strong-test-password"
          PUBLIC_BASE_URL: https://sales.example.com/
      - name: Run tests
        run: npm test
