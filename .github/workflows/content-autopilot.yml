name: TAINA Content Autopilot Checks

on:
  pull_request:
    paths:
      - "content-autopilot/**"
      - ".github/workflows/content-autopilot.yml"
  push:
    branches:
      - "feat/taina-smm-manual-publishing"
    paths:
      - "content-autopilot/**"
      - ".github/workflows/content-autopilot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: content-autopilot/package-lock.json
      - name: Install dependencies
        working-directory: content-autopilot
        run: npm ci
      - name: Run unit and safety tests
        working-directory: content-autopilot
        run: npm test
      - name: Audit dependencies
        working-directory: content-autopilot
        run: npm audit --audit-level=moderate
      - name: Check JavaScript syntax
        working-directory: content-autopilot
        run: |
          node --check index.js
          find src test -name "*.js" -print0 | xargs -0 -n1 node --check
