name: TAINA Content Autopilot Checks

on:
  pull_request:
    paths:
      - "content-autopilot/**"
      - ".github/workflows/content-autopilot.yml"
  push:
    branches:
      - "feat/taina-smm-manual-publishing"
    paths:
      - "content-autopilot/**"
      - ".github/workflows/content-autopilot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: content-autopilot/package-lock.json
      - name: Refresh dependency lockfile
        working-directory: content-autopilot
        run: npm audit fix --package-lock-only
      - name: Install dependencies
        working-directory: content-autopilot
        run: npm ci
      - name: Run unit and safety tests
        working-directory: content-autopilot
        run: npm test
      - name: Fail on known dependency vulnerabilities
        working-directory: content-autopilot
        run: npm audit --audit-level=moderate
      - name: Upload refreshed lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: content-autopilot-package-lock
          path: content-autopilot/package-lock.json
          if-no-files-found: error
      - name: Check JavaScript syntax
        working-directory: content-autopilot
        run: |
          node --check index.js
          find src test -name "*.js" -print0 | xargs -0 -n1 node --check
