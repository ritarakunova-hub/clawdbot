name: TAINA Content Autopilot Checks

on:
  pull_request:
    paths:
      - "content-autopilot/**"
      - ".github/workflows/content-autopilot.yml"
  push:
    branches:
      - "feat/taina-smm-manual-publishing"
    paths:
      - "content-autopilot/**"
      - ".github/workflows/content-autopilot.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: content-autopilot/package-lock.json
      - name: Refresh dependency lockfile
        working-directory: content-autopilot
        run: npm audit fix --package-lock-only
      - name: Install dependencies
        working-directory: content-autopilot
        run: npm ci
      - name: Run unit and safety tests
        working-directory: content-autopilot
        run: npm test
      - name: Fail on known dependency vulnerabilities
        working-directory: content-autopilot
        run: npm audit --audit-level=moderate
      - name: Check JavaScript syntax
        working-directory: content-autopilot
        run: |
          node --check index.js
          find src test -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Commit security-updated lockfile to this feature branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if ! git diff --quiet -- content-autopilot/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content-autopilot/package-lock.json
            git commit -m "fix(deps): apply npm security updates"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
