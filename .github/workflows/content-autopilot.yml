name: Content Autopilot Checks

on:
  pull_request:
    paths:
      - "content-autopilot/**"
      - ".github/workflows/content-autopilot.yml"
  push:
    branches:
      - "feat/content-autopilot-safe-approval"
    paths:
      - "content-autopilot/**"
      - ".github/workflows/content-autopilot.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    defaults:
      run:
        working-directory: content-autopilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: content-autopilot/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
