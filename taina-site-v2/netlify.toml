[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Та же версия, что использовалась при разработке — без неё Netlify
  # по умолчанию берёт более старую (обычно 18-ю), что может дать другую
  # сборку, чем локально.
  NODE_VERSION = "22"

# Заголовки на все страницы: индексация, безопасность, CSP.
[[headers]]
  for = "/*"
  [headers.values]
    # Сайт пока черновик — запрещаем индексацию на всех ветках/превью,
    # дублирует <meta name="robots" content="noindex"> в Layout.astro.
    # TODO(Этап 14, SEO): убрать, когда будем готовы к индексации.
    X-Robots-Tag = "noindex"
    # Базовые заголовки безопасности (Этап 15).
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP сначала в режиме report-only (PROMPTS.md, Этап 15) — ничего не
    # блокирует, только показывает нарушения в консоли браузера при
    # ручной проверке. Без report-uri/report-to (нет сервиса для приёма
    # отчётов) — добавить сюда, если понадобится собирать нарушения
    # автоматически, а не смотреть в консоли самому.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Хешированные ассеты (JS/CSS/шрифты со случайным именем в /_astro/) —
# можно кэшировать навсегда, при изменении файла поменяется и имя.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — без долгого кэша, чтобы обновления сайта доходили сразу, а не
# ждали, пока у посетителя истечёт старый кэш.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
